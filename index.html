<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Report Chicken Crush</title>
<meta name="theme-color" content="#0a0c11">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="logo.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Chicken Crush">
<style>
:root{--bg:#0a0c11;--c1:#141923;--c2:#1b2230;--bd:#263042;--tx:#e8ecf4;--mu:#8b97ad;--ac:#ffb703;--rd:#e63946;--ok:#2ecc71}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
h2{font-size:22px;margin-bottom:14px}h3{margin-bottom:8px}.mu{color:var(--mu)}.hide{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--c2);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;outline:0;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px #ffb70326}select option{background:var(--c2)}
label{display:block;font-size:12.5px;color:var(--mu);margin:10px 0 4px}textarea{min-height:120px;resize:vertical}
.btn{background:linear-gradient(135deg,var(--ac),#ff8c00);color:#1a1200;font-weight:700;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px #ffb70340}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:var(--c2);color:var(--tx);border:1px solid var(--bd)}.btn.red{background:var(--rd);color:#fff}.btn.sm{padding:6px 11px;font-size:13px}
.card{background:var(--c1);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;animation:up .4s both}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.fl{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.fl>*{flex:1;min-width:130px}.fl .btn{flex:0 0 auto}
.stat b{display:block;font-size:26px;color:var(--ac)}.stat span{color:var(--mu);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px}table{width:100%;border-collapse:collapse;font-size:13.5px}
td{max-width:320px;overflow:hidden;text-overflow:ellipsis}th,td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--bd)}th{background:var(--c2);color:var(--mu);position:sticky;top:0}tr:hover td{background:#ffffff08}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;background:#ffb70322;color:var(--ac)}.tag.g{background:#2ecc7122;color:var(--ok)}.tag.r{background:#e6394622;color:var(--rd)}
@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes fl{50%{transform:translateY(-14px)}}@keyframes sw{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(10deg)}}
@keyframes sh{to{background-position:200% 0}}@keyframes orb{50%{transform:translate(40px,-30px) scale(1.2)}}@keyframes pulse{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.sk{height:84px;border-radius:14px;margin-bottom:10px;background:linear-gradient(90deg,var(--c1) 25%,var(--c2) 50%,var(--c1) 75%);background-size:200% 100%;animation:sh 1.2s linear infinite}
#splash{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99;transition:.4s}#splash img{width:120px;animation:fl 1.2s infinite}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;position:relative;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35;animation:orb 9s infinite}.o1{width:340px;height:340px;background:var(--ac);top:-80px;left:-80px}.o2{width:300px;height:300px;background:var(--rd);bottom:-60px;left:30%;animation-delay:-4s}
.hero{display:grid;place-items:center;text-align:center;padding:30px;position:relative}.mascot{position:relative;width:min(300px,60vw)}.mascot img{width:100%;animation:fl 3.5s ease-in-out infinite;filter:drop-shadow(0 20px 30px #0008)}
.mascot:before,.mascot:after{content:"";position:absolute;inset:8%;border:2px solid var(--ac);border-radius:50%;animation:pulse 2.6s infinite}.mascot:after{animation-delay:1.3s}
.ttl{font-size:clamp(26px,4vw,42px);font-weight:800;margin-top:22px;background:linear-gradient(90deg,#fff,var(--ac),#fff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 4s linear infinite}
.fp{display:grid;place-items:center;padding:24px;position:relative}.fb{width:100%;max-width:400px;background:#141923cc;backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:22px;padding:26px;animation:up .6s both}
.tabs{display:flex;background:var(--c2);border-radius:12px;padding:4px;margin-bottom:8px}.tabs button{flex:1;border:0;background:none;padding:9px;border-radius:9px;cursor:pointer;color:var(--mu);font-weight:600}.tabs .on{background:var(--ac);color:#1a1200}
.quote{position:fixed;left:0;right:0;bottom:0;text-align:center;padding:9px 16px;font-size:13px;color:var(--mu);background:linear-gradient(transparent,#0a0c11e6 60%);pointer-events:none;z-index:5}.quote b{color:var(--ac)}
@media(max-width:800px){#login{grid-template-columns:1fr}.hero{padding:20px 10px 0}.mascot{width:150px}.ttl{margin-top:10px}}
/* shell */
#app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--c1);border-right:1px solid var(--bd);padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;margin:0 6px 16px}.brand img{width:40px}.brand small{display:block;color:var(--mu);font-weight:400;font-size:11px}
aside a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--mu);text-decoration:none;margin-bottom:2px;transition:.15s}
aside a:hover{background:var(--c2);color:var(--tx)}aside a.on{background:linear-gradient(90deg,#ffb70330,transparent);color:var(--ac);font-weight:700}aside hr{border:0;border-top:1px solid var(--bd);margin:10px 4px}
main{padding:22px 22px 80px;max-width:1100px;width:100%}.top{display:none}
.mod{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:50;padding:14px}.mod .box{background:var(--c1);border:1px solid var(--bd);border-radius:18px;padding:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto}.mod img{max-width:100%;border-radius:12px;margin-bottom:10px}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:420px;margin:10px 0}.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.dist{font-size:30px;font-weight:800}#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:grid;gap:8px}
#toast div{background:var(--c2);border:1px solid var(--ac);padding:10px 16px;border-radius:12px;animation:up .3s;max-width:90vw}#toast .e{border-color:var(--rd)}
@media(max-width:800px){#app{grid-template-columns:1fr}aside{position:fixed;bottom:0;top:auto;height:auto;width:100%;z-index:20;display:flex;gap:2px;overflow-x:auto;padding:6px;border-top:1px solid var(--bd);border-right:0}
aside .brand,aside hr{display:none}aside a{flex-direction:column;gap:0;font-size:10.5px;padding:6px 10px;white-space:nowrap;margin:0}main{padding:16px 14px 150px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top img{width:34px}.quote{bottom:62px;background:#0a0c11cc}}
</style></head><body>
<div id="splash"><img src="logo.png" alt=""></div><div id="toast"></div>
<div id="root"></div>
<div class="quote" id="quote"></div>
<script>
const CONFIG={API:'GANTI_DENGAN_URL_APPS_SCRIPT_/exec',GOOGLE_CLIENT_ID:''};
const DIV=['SUPER ADMIN','HRD','BM','FINANCE','CREATIVE','QC','DOS','LOGISTIK','PRODUKSI','DRIVER'];
const QUOTES=['Mulai dari yang kecil, konsisten setiap hari.','Kerja keras hari ini adalah rasa bangga esok hari.','Pelayanan terbaik dimulai dari senyum pertama.','Tim hebat dibangun dari kebiasaan kecil yang disiplin.','Jangan tunggu sempurna, mulai dan perbaiki sambil jalan.','Kualitas bukan kebetulan, ia lahir dari niat dan ketelitian.','Setiap laporan jujur adalah langkah menuju perbaikan.','Gagal itu data, bukan akhir cerita.','Disiplin adalah jembatan antara target dan hasil.','Rezeki mengikuti orang yang bersungguh-sungguh.','Hari ini lebih baik dari kemarin, itu sudah cukup.','Satu pelanggan puas lebih berharga dari seribu janji.','Bekerja dengan hati, hasilnya terasa di setiap gigitan.','Kebersihan dan kerapian adalah wajah usahamu.','Kolaborasi membuat yang berat jadi ringan.','Tepat waktu adalah bentuk menghargai orang lain.','Fokus pada proses, hasil akan menyusul.','Tanggung jawab kecil yang dijaga membuat kepercayaan besar.','Semangat pagi, selesaikan dengan tuntas.','Berani melapor kendala adalah tanda profesional.','Ayam crispy butuh api yang tepat, karier butuh usaha yang tepat.','Jangan bandingkan dirimu dengan orang lain, bandingkan dengan dirimu kemarin.','Sabar dan telaten, hasil manis menanti.','Energi positifmu menular ke seluruh tim.','Kerjakan hal biasa dengan cara yang luar biasa.','Syukuri hari ini, tingkatkan esok hari.','Rapikan data hari ini, mudahkan keputusan besok.','Ketelitian menyelamatkan waktu dan biaya.','Pekerjaan baik dimulai dari niat yang baik.','Kamu bagian penting dari Chicken Crush.','Teruslah belajar, tidak ada kata terlambat.'];
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=(o=0)=>new Date(Date.now()+7*36e5+o*864e5).toISOString().slice(0,10);
const doy=Math.floor((Date.now()+7*36e5)/864e5);$('#quote').innerHTML='💬 <b>Motivasi hari ini:</b> '+QUOTES[doy%QUOTES.length];
let S={t:localStorage.getItem('t')||'',u:null,outlets:[]},cleanup=null,deferred=null;
async function api(a,d={}){let r;try{r=await fetch(CONFIG.API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({a,t:S.t,...d})})}catch(e){throw new Error('Tidak ada koneksi ke server')}
 const j=await r.json();if(!j.ok){if(j.e==='AUTH'){logout(true);throw new Error('Sesi berakhir, silakan login ulang')}throw new Error(j.e)}return j.d}
function toast(m,e){const d=document.createElement('div');d.textContent=m;if(e)d.className='e';$('#toast').append(d);setTimeout(()=>d.remove(),3800)}
function modal(h){const d=document.createElement('div');d.className='mod';d.innerHTML=`<div class=box>${h}<button class="btn ghost" data-x style="margin-top:8px">Tutup</button></div>`;d.onclick=e=>{if(e.target===d||e.target.dataset.x!==undefined)d.remove()};document.body.append(d);return d}
const sk=()=>'<div class=sk></div><div class=sk></div><div class=sk></div>';
const can=p=>{const d=S.u.divisi;return d==='SUPER ADMIN'||(d==='HRD'&&(p==='rep_all'||p==='att_all'))||(d==='BM'&&p==='rep_all')};
function tbl(cols,rows){return `<div class=tw><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr>${cols.map(c=>`<td>${typeof c[1]==='function'?c[1](r,i):esc(r[c[1]])}</td>`).join('')}</tr>`).join(''):'<tr><td colspan=99 class=mu>Tidak ada data</td></tr>'}</tbody></table></div>`}
function csv(name,cols,rows){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',k=cols.filter(c=>typeof c[1]==='string');
 const t='\ufeff'+[k.map(c=>q(c[0])).join(','),...rows.map(r=>k.map(c=>q(r[c[1]])).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name+'_'+ymd()+'.csv';a.click()}
const opts=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
const stag=s=>`<span class="tag ${s==='SELESAI'||s==='AKTIF'||s==='MASUK'?'g':s==='TINGGI'||s==='NONAKTIF'?'r':''}">${esc(s)}</span>`;
/* ---------- LOGIN ---------- */
function loginView(){$('#root').innerHTML=`<div id=login><div class="orb o1"></div><div class="orb o2"></div>
<div class=hero><div><div class=mascot><img src="logo.png" alt="Chicken Crush"></div><div class=ttl>Daily Report<br>Chicken Crush</div><p class=mu style="margin-top:6px">Presensi & laporan harian tim, lebih cepat.</p></div></div>
<div class=fp><div class=fb><div class=tabs><button class=on data-m=in>Masuk</button><button data-m=up>Daftar</button></div>
<div id=nm class=hide><label>Nama lengkap</label><input id=n autocomplete=name><label>Divisi</label><select id=dv>${opts(DIV.slice(1))}</select></div>
<label>Email</label><input id=em type=email autocomplete=email><label>Password</label><input id=pw type=password autocomplete=current-password>
<button class=btn id=go style="width:100%;margin-top:16px">Masuk</button><div id=gb style="margin-top:14px;display:grid;place-items:center"></div>
<p class=mu id=hint style="font-size:12px;margin-top:10px;text-align:center">Akun baru perlu disetujui Super Admin.</p></div></div></div>`;
 let mode='in';document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));$('#nm').classList.toggle('hide',mode==='in');$('#go').textContent=mode==='in'?'Masuk':'Daftar Akun'});
 const done=d=>{S.t=d.t;S.u=d.u;S.outlets=d.outlets;localStorage.setItem('t',d.t);shell()};
 $('#go').onclick=async()=>{const b=$('#go');b.disabled=true;try{if(mode==='in')done(await api('login',{email:$('#em').value,pw:$('#pw').value}));
  else{const r=await api('register',{nama:$('#n').value,divisi:$('#dv').value,email:$('#em').value,pw:$('#pw').value});toast(r.msg);document.querySelector('[data-m=in]').click()}}catch(e){toast(e.message,1)}b.disabled=false};
 $('#pw').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
 if(CONFIG.GOOGLE_CLIENT_ID){const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=()=>{google.accounts.id.initialize({client_id:CONFIG.GOOGLE_CLIENT_ID,callback:async r=>{try{done(await api('google',{cred:r.credential,divisi:$('#dv').value}))}catch(e){toast(e.message,1)}}});google.accounts.id.renderButton($('#gb'),{theme:'filled_black',size:'large',shape:'pill',text:'continue_with'})};document.head.append(s)}}
function logout(q){S.t='';S.u=null;localStorage.removeItem('t');if(cleanup)cleanup();loginView();if(!q)toast('Anda sudah keluar')}
/* ---------- SHELL ---------- */
const NAV=[['dash','🏠','Dashboard'],['att','📸','Presensi'],['rep','📝','Buat Laporan'],['iss','⚠️','Kendala'],['sep'],['repl','📊','Laporan',()=>can('rep_all')],['attl','🗓️','Laporan Presensi',()=>can('att_all')],['usr','👥','Kelola User',()=>S.u.divisi==='SUPER ADMIN'],['sep'],['set','⚙️','Pengaturan']];
function shell(){const items=NAV.filter(n=>!n[3]||n[3]()).map(n=>n[0]==='sep'?'<hr>':`<a href="#${n[0]}" data-p="${n[0]}"><span>${n[1]}</span>${n[2]}</a>`).join('');
 $('#root').innerHTML=`<div id=app><aside><div class=brand><img src="logo.png" alt=""><div>Chicken Crush<small>${esc(S.u.divisi)}</small></div></div>${items}</aside><main><div class=top><img src="logo.png" alt=""><b>Daily Report Chicken Crush</b></div><div id=pg></div></main></div>`;route()}
async function route(){if(!S.u)return;if(cleanup){cleanup();cleanup=null}const p=(location.hash.slice(1)||'dash'),pg=$('#pg');
 document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.dataset.p===p));
 const ok={repl:can('rep_all'),attl:can('att_all'),usr:S.u.divisi==='SUPER ADMIN'};if(ok[p]===false||!P[p]){location.hash='dash';return}
 pg.innerHTML=sk();try{await P[p](pg)}catch(e){pg.innerHTML=`<div class=card>⚠️ ${esc(e.message)}</div>`}}
addEventListener('hashchange',route);
function filt(extra=''){return `<div class="card fl"><div><label>Dari</label><input type=date id=f value="${ymd(-7)}"></div><div><label>Sampai</label><input type=date id=e value="${ymd()}"></div><div><label>Divisi</label><select id=dv><option value="">Semua</option>${opts(DIV)}</select></div><button id=go class=btn>Tampilkan</button><button id=dl class="btn ghost">⬇ Unduh CSV</button></div><div id=out></div>`}
async function listPage(m,c){m.innerHTML=`<h2>${c.title}</h2>`+filt();let data=[];const out=$('#out');
 const load=async()=>{out.innerHTML=sk();try{data=await api(c.act,{from:$('#f').value,to:$('#e').value,div:$('#dv').value});out.innerHTML=`<p class=mu style="margin-bottom:6px">${data.length} data</p>`+tbl(c.cols,data)}catch(e){out.innerHTML=`<div class=card>⚠️ ${esc(e.message)}</div>`}};
 $('#go').onclick=load;$('#dl').onclick=()=>data.length?csv(c.file,c.cols,data):toast('Tampilkan data dulu',1);
 out.onclick=async e=>{const b=e.target.closest('[data-i]');if(!b)return;const r=data[b.dataset.i];if(b.dataset.k==='foto'){b.disabled=true;try{const f=await api('att_foto',{id:r.id});modal(`<img src="${f}" alt="selfie"><p>${esc(r.nama)} · ${esc(r.tipe)} · ${esc(r.tanggal)} ${esc(r.jam)}</p>`)}catch(x){toast(x.message,1)}b.disabled=false}
  else if(b.dataset.k==='lihat')modal(`<h3>${esc(r.judul)}</h3><p class=mu>${esc(r.nama)} · ${esc(r.divisi)} · ${esc(r.tanggal)} ${esc(r.jam)}</p><p style="white-space:pre-wrap;margin-top:10px">${esc(r.isi)}</p>`);
  else if(b.dataset.k==='st'){try{await api('iss_set',{id:r.id,status:b.dataset.s});toast('Status diperbarui');load()}catch(x){toast(x.message,1)}}};
 load()}
const btn=(k,t,s)=>(r,i)=>`<button class="btn ghost sm" data-k="${k}" data-i="${i}" ${s?`data-s="${s}"`:''}>${t}</button>`;
const P={
async dash(m){const d=await api('dash');const h=new Date(Date.now()+7*36e5).getUTCHours();
 m.innerHTML=`<h2>${h<11?'Selamat pagi':h<15?'Selamat siang':h<18?'Selamat sore':'Selamat malam'}, ${esc(S.u.nama.split(' ')[0])} 👋</h2><div class=grid>${d.cards.map(c=>`<div class="card stat"><b>${esc(c.v)}</b><span>${esc(c.l)}</span></div>`).join('')}</div>
 <div class="card"><h3>Aksi cepat</h3><div class=fl><a href="#att" class=btn style="text-decoration:none;text-align:center">📸 Presensi</a><a href="#rep" class="btn ghost" style="text-decoration:none;text-align:center">📝 Buat laporan</a><a href="#iss" class="btn ghost" style="text-decoration:none;text-align:center">⚠️ Lapor kendala</a></div></div>`},
async att(m){const today=await api('att_today');const has=t=>today.some(r=>r.tipe===t);let pos=null,stream=null,wid=null;
 const mine=S.outlets.find(o=>o.nama===S.u.outlet)?S.u.outlet:(S.outlets[0]||{}).nama;
 m.innerHTML=`<h2>Presensi</h2><div class=card><label>Outlet</label><select id=ot>${opts(S.outlets.map(o=>o.nama),mine)}</select>
 <div style="margin-top:12px"><span class=mu>Jarak ke titik outlet</span><div class=dist id=ds>—</div><div class=mu id=gp style="font-size:13px">Mencari lokasi…</div></div>
 <div class=cam><video id=v autoplay playsinline muted></video></div><canvas id=cv class=hide></canvas>
 <div class=fl style="max-width:420px"><button class=btn id=bi disabled>✅ Presensi Masuk ${has('MASUK')?'(selesai)':''}</button><button class="btn ghost" id=bo disabled>🏁 Presensi Pulang ${has('PULANG')?'(selesai)':''}</button></div>
 <p class=mu style="font-size:12px;margin-top:8px">Selfie wajib dari kamera langsung. Maksimal radius 100 m dari titik outlet.</p></div>
 <div class=card><h3>Presensi hari ini</h3>${tbl([['Jam','jam'],['Tipe',r=>stag(r.tipe)],['Outlet','outlet'],['Jarak',r=>r.jarak+' m']],today)}</div>`;
 const radius=()=>{const o=S.outlets.find(x=>x.nama===$('#ot').value);return o?Math.min(+o.radius||100,100):100};
 const D=(a,b,c,d)=>{const R=6371000,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
 const upd=()=>{const o=S.outlets.find(x=>x.nama===$('#ot').value);if(!pos||!o){return}const j=Math.round(D(pos.lat,pos.lng,+o.lat,+o.lng)),ok=j<=radius()&&pos.acc<=100;
  $('#ds').textContent=j+' m';$('#ds').style.color=ok?'var(--ok)':'var(--rd)';$('#gp').textContent=(j<=radius()?'Dalam radius':'Di luar radius '+radius()+' m')+' · akurasi GPS ±'+Math.round(pos.acc)+' m'+(pos.acc>100?' (terlalu rendah)':'');
  $('#bi').disabled=!(ok&&stream&&!has('MASUK'));$('#bo').disabled=!(ok&&stream&&has('MASUK')&&!has('PULANG'))};
 $('#ot').onchange=upd;
